name: Deploy private AKS with ACR and Ingress

on:
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: 'Resource Group Name'
        required: true
      cluster:
        description: 'Cluster Name'
        required: true
      acr:
        description: 'ACR Name'
        required: true
      location:
        description: 'Azure region (default: Israel Central)'
        required: true
        default: 'Israel Central'
        type: choice
        options:
          - eastus
          - Israel Central
      enableMonitoring:
        description: 'Enable monitoring with Log Analytics'
        required: true
        type: choice
        options: [true, false]
        default: true
      vnetName:
        description: 'Virtual Network Name'
        required: false
        default: 'aks-vnet'
      subnetName:
        description: 'Subnet Name'
        required: false
        default: 'aks-subnet'
      subnetPrefix:
        description: 'Subnet address prefix'
        required: false
        default: '10.240.0.0/16'
      nodeCount:
        description: 'Number of AKS nodes'
        required: false
        default: '1'
      nodeSize:
        description: 'AKS Node VM Size'
        required: false
        default: 'Standard_B2s'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set environment variables
      run: |
        echo "RG=${{ github.event.inputs.resourceGroup }}" >> $GITHUB_ENV
        echo "CLUSTER_NAME=${{ github.event.inputs.cluster }}" >> $GITHUB_ENV
        echo "ACR_NAME=${{ github.event.inputs.acr }}" >> $GITHUB_ENV
        echo "LOCATION=${{ github.event.inputs.location }}" >> $GITHUB_ENV
        echo "ENABLE_MONITORING=${{ github.event.inputs.enableMonitoring }}" >> $GITHUB_ENV
        echo "VNET_NAME=${{ github.event.inputs.vnetName }}" >> $GITHUB_ENV
        echo "SUBNET_NAME=${{ github.event.inputs.subnetName }}" >> $GITHUB_ENV
        echo "SUBNET_PREFIX=${{ github.event.inputs.subnetPrefix }}" >> $GITHUB_ENV
        echo "ADDRESS_PREFIX=10.0.0.0/8" >> $GITHUB_ENV
        echo "NODE_COUNT=${{ github.event.inputs.nodeCount }}" >> $GITHUB_ENV
        echo "NODE_SIZE=${{ github.event.inputs.nodeSize }}" >> $GITHUB_ENV
        echo "ENABLE_NETWORK_POLICY=false" >> $GITHUB_ENV

    - name: Parse Azure credentials
      id: parse-creds
      run: |
        echo "CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientId)" >> $GITHUB_ENV
        echo "CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientSecret)" >> $GITHUB_ENV
        echo "TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .tenantId)" >> $GITHUB_ENV

    - name: Create Resource Group
      run: az group create --name $RG --location "$LOCATION"

    - name: Create Virtual Network and Subnet
      run: |
        az network vnet create \
          --resource-group $RG \
          --name $VNET_NAME \
          --address-prefixes $ADDRESS_PREFIX \
          --subnet-name $SUBNET_NAME \
          --subnet-prefix $SUBNET_PREFIX

        SUBNET_ID=$(az network vnet subnet show \
          --resource-group $RG \
          --vnet-name $VNET_NAME \
          --name $SUBNET_NAME \
          --query id -o tsv)

        echo "SUBNET_ID=$SUBNET_ID" >> $GITHUB_ENV

    - name: Create ACR
      run: |
        az acr create \
          --name $ACR_NAME \
          --resource-group $RG \
          --sku Basic \
          --location "$LOCATION"

    - name: Create Private AKS Cluster
      run: |
        if [ "$ENABLE_MONITORING" = "true" ]; then
          MONITORING_FLAG="--enable-addons monitoring"
        else
          MONITORING_FLAG=""
        fi

        az aks create \
          --name $CLUSTER_NAME \
          --resource-group $RG \
          --location "$LOCATION" \
          --node-count $NODE_COUNT \
          --node-vm-size $NODE_SIZE \
          --network-plugin azure \
          --vnet-subnet-id $SUBNET_ID \
          --enable-private-cluster \
          --enable-managed-identity \
          --attach-acr $ACR_NAME \
          $MONITORING_FLAG \
          --generate-ssh-keys

name: Create private AKS with ACR and Ingress

on:
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: 'Resource Group Name'
        required: true
      cluster:
        description: 'Cluster Name'
        required: true
      acr:
        description: 'ACR Name'
        required: true
      location:
        description: 'Azure region (default: Israel Central)'
        required: true
        default: 'Israel Central'
        type: choice
        options:
          - eastus
          - Israel Central
      enableMonitoring:
        description: 'Enable monitoring with Log Analytics'
        required: true
        type: choice
        options: [true, false]
        default: true
      vnetName:
        description: 'Virtual Network Name'
        required: false
        default: 'aks-vnet'
      subnetName:
        description: 'Subnet Name'
        required: false
        default: 'aks-subnet'
      subnetPrefix:
        description: 'Subnet address prefix'
        required: false
        default: '10.240.0.0/16'
      nodeCount:
        description: 'Number of AKS nodes'
        required: false
        default: '1'
      nodeSize:
        description: 'AKS Node VM Size'
        required: false
        default: 'Standard_B2s'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set environment variables
      run: |
        echo "RG=${{ github.event.inputs.resourceGroup }}" >> $GITHUB_ENV
        echo "CLUSTER_NAME=${{ github.event.inputs.cluster }}" >> $GITHUB_ENV
        echo "ACR_NAME=${{ github.event.inputs.acr }}" >> $GITHUB_ENV
        echo "LOCATION=${{ github.event.inputs.location }}" >> $GITHUB_ENV
        echo "ENABLE_MONITORING=${{ github.event.inputs.enableMonitoring }}" >> $GITHUB_ENV
        echo "VNET_NAME=${{ github.event.inputs.vnetName }}" >> $GITHUB_ENV
        echo "SUBNET_NAME=${{ github.event.inputs.subnetName }}" >> $GITHUB_ENV
        echo "SUBNET_PREFIX=${{ github.event.inputs.subnetPrefix }}" >> $GITHUB_ENV
        echo "ADDRESS_PREFIX=10.0.0.0/8" >> $GITHUB_ENV
        echo "NODE_COUNT=${{ github.event.inputs.nodeCount }}" >> $GITHUB_ENV
        echo "NODE_SIZE=${{ github.event.inputs.nodeSize }}" >> $GITHUB_ENV
        echo "ENABLE_NETWORK_POLICY=false" >> $GITHUB_ENV

    - name: Parse Azure credentials
      id: parse-creds
      run: |
        echo "CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientId)" >> $GITHUB_ENV
        echo "CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientSecret)" >> $GITHUB_ENV
        echo "TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .tenantId)" >> $GITHUB_ENV

    - name: Create Resource Group
      run: az group create --name $RG --location "$LOCATION"

    - name: Create Virtual Network and Subnet
      run: |
        az network vnet create \
          --resource-group $RG \
          --name $VNET_NAME \
          --address-prefixes $ADDRESS_PREFIX \
          --subnet-name $SUBNET_NAME \
          --subnet-prefix $SUBNET_PREFIX

        SUBNET_ID=$(az network vnet subnet show \
          --resource-group $RG \
          --vnet-name $VNET_NAME \
          --name $SUBNET_NAME \
          --query id -o tsv)

        echo "SUBNET_ID=$SUBNET_ID" >> $GITHUB_ENV

    - name: Create ACR
      run: |
        az acr create \
          --name $ACR_NAME \
          --resource-group $RG \
          --sku Basic \
          --location "$LOCATION"

    - name: Create Private AKS Cluster
      run: |
        if [ "$ENABLE_MONITORING" = "true" ]; then
          MONITORING_FLAG="--enable-addons monitoring"
        else
          MONITORING_FLAG=""
        fi

        az aks create \
          --name $CLUSTER_NAME \
          --resource-group $RG \
          --location "$LOCATION" \
          --node-count $NODE_COUNT \
          --node-vm-size $NODE_SIZE \
          --network-plugin azure \
          --vnet-subnet-id $SUBNET_ID \
          --enable-private-cluster \
          --enable-managed-identity \
          --attach-acr $ACR_NAME \
          $MONITORING_FLAG \
          --generate-ssh-keys

    - name: Create Jumpbox VM
      run: |
        az vm create \
          --resource-group $RG \
          --name aks-jumpbox \
          --image Ubuntu2204 \
          --size Standard_B2s \
          --admin-username azureuser \
          --generate-ssh-keys \
          --vnet-name $VNET_NAME \
          --subnet $SUBNET_NAME \
          --public-ip-address aks-jumpbox-ip \
          --output json > jumpbox.json

    - name: SSH and configure jumpbox
      run: |
        ssh -i ~/.ssh/id_rsa azureuser@$JUMPBOX_PUBLIC_IP -o StrictHostKeyChecking=no <<'EOF'
          set -e

          export AZURE_CLIENT_ID="${{ env.CLIENT_ID }}"
          export AZURE_CLIENT_SECRET="${{ env.CLIENT_SECRET }}"
          export AZURE_TENANT_ID="${{ env.TENANT_ID }}"
          export RG="${{ env.RG }}"
          export CLUSTER_NAME="${{ env.CLUSTER_NAME }}"

          # Install tools
          sudo apt update && sudo apt install -y curl apt-transport-https ca-certificates gnupg unzip lsb-release
          curl -fsSL https://get.docker.com | sudo bash
          sudo usermod -aG docker azureuser

          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

          curl -sL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/microsoft.gpg > /dev/null
          echo "deb [arch=amd64] https://packages.microsoft.com/repos/azure-cli/ \$(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/azure-cli.list
          sudo apt update && sudo apt install -y azure-cli

          KUBECTL_VERSION=\$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)
          curl -LO "https://dl.k8s.io/release/\${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

          # Azure CLI login
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID"

          # Connect to AKS
          az aks get-credentials \
            --resource-group "$RG" \
            --name "$CLUSTER_NAME" \
            --overwrite-existing

          # Install internal NGINX ingress controller
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm upgrade --install internal-ingress bitnami/nginx-ingress-controller \
            --namespace ingress-nginx \
            --create-namespace \
            --set service.type=LoadBalancer \
            --set-string service.annotations."service.beta.kubernetes.io/azure-load-balancer-internal"="true" \
            --set rbac.create=true \
            --set controller.publishService.enabled=true
        EOF